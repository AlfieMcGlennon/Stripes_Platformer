<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Height Check</title>
    <meta name="description" content="A tiny retro platformer about weather noise, climate trends and the warming stripes. Built on the HadCRUT5 temperature record." />
    <meta name="theme-color" content="#0b1020" />
    <meta property="og:title" content="Height Check" />
    <meta property="og:description" content="Day to day it's noise. Zoom out and it's a trend. A tiny game built on real climate data." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #000; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      canvas { display: block; }

      /* Visible to screen readers only. Captions are mirrored here as they appear. */
      .sr {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      .fallback {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 3;
        margin: 0; padding: 24px; background: #0b1020;
        font: 15px/1.6 system-ui, sans-serif; color: #f2efe6; text-align: center;
      }
    </style>
  </head>
  <body>
    <!--
      Fallback content inside the canvas is what a text browser, a very old
      browser, or a policy that disables canvas will show instead of a black
      rectangle. The panel below carries the same content for everyone else.
    -->
    <canvas id="game" aria-label="Height Check: a game about weather noise and climate trends. A text version is in the panel at the bottom left.">
      Height Check is a small game about the difference between day-to-day weather noise
      and a long-term climate trend. This browser cannot draw it, but the text version in
      the panel at the bottom of the page tells the whole story.
    </canvas>

    <div id="live" class="sr" role="status" aria-live="polite"></div>

    <noscript>
      <p class="fallback">
        Height Check needs JavaScript to run. It is a small game about how a single day
        or year tells you nothing about a climate trend, built on the HadCRUT5 global
        temperature record from the Met Office Hadley Centre and CRU.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
