# Test, build and publish the game to GitHub Pages.
# Manual only for now: Actions tab -> deploy -> "Run workflow" when you're ready to go public.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# To deploy on every push instead, add:  push: { branches: [main] }
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One project graph across the engine and both episodes.
      - run: npm run typecheck
      - run: npm test
      # Data sanity checks read only the committed JSON (no numpy or network needed).
      - run: pip install pytest && python -m pytest -q scripts/test_data.py
      - run: npm run build
      # Assemble one site: a landing page, then each episode in its own folder.
      - name: Assemble site
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          cp -r episodes/height-check/dist site/height-check
          cp -r episodes/carbon-road/dist site/carbon-road
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
