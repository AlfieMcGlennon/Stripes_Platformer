# Test, build and publish the game to GitHub Pages.
# Manual only for now: Actions tab -> deploy -> "Run workflow" when you're ready to go public.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# To deploy on every push instead, add:  push: { branches: [main] }
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Data sanity checks read only the committed JSON (no numpy/network needed).
      - run: pip install pytest && python -m pytest -q scripts/test_data.py
      # src/data/*.json is committed, so CI never needs Python or network access to data hosts.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
